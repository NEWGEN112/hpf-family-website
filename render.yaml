services:
  - type: web
    name: hpf-family
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: HPF_SECRET_KEY
        generateValue: true
