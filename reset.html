<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - HPF Family</title>
  <style>
    body { margin:0; background:#f4f0e7; font-family:Arial,sans-serif; color:#171512; }
    .wrap { max-width:500px; margin:auto; padding:40px 6%; }
    .brand { font-weight:900; text-decoration:none; color:#171512; }
    .box { margin-top:60px; background:#fffaf0; border:1px solid #d0c5b4; padding:30px; }
    h1 { font-family:Georgia,serif; font-size:36px; margin:10px 0 20px; }
    .ey { font-size:10px; letter-spacing:.2em; color:#8c6b2d; font-weight:800; }
    label { font-size:10px; font-weight:800; text-transform:uppercase; display:block; }
    input { width:100%; box-sizing:border-box; padding:14px; margin:8px 0 18px; border:1px solid #bbb; }
    button { background:#d5a943; border:0; padding:15px 22px; font-weight:800; width:100%; }
    .msg { margin-top:15px; padding:14px; display:none; }
    .ok { background:#e5efd9; display:block; }
    .err { background:#f5dede; display:block; }
    a { color:#8c6b2d; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="index.html">🔥 HPF FAMILY</a>
    <div class="box">
      <div class="ey">SET NEW PASSWORD</div>
      <h1>Create a new password</h1>
      <p>Enter your new password below (minimum 8 characters).</p>
      <form id="reset">
        <label>New Password</label>
        <input required type="password" name="password" minlength="8" placeholder="At least 8 characters">
        <label>Confirm Password</label>
        <input required type="password" id="confirm" minlength="8" placeholder="Type it again">
        <button type="submit">Update Password ↗</button>
      </form>
      <div id="msg" class="msg"></div>
      <p style="margin-top:20px"><a href="login.html">← Back to Login</a></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('msg').className = 'msg err';
      document.getElementById('msg').style.display = 'block';
      document.getElementById('msg').textContent = 'Invalid reset link. Please request a new one.';
    }

    document.getElementById('reset').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const password = e.target.password.value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        msg.className = 'msg err';
        msg.style.display = 'block';
        msg.textContent = 'Passwords do not match';
        return;
      }

      msg.className = 'msg';
      msg.style.display = 'block';
      msg.textContent = 'Updating password...';

      try {
        const r = await fetch('/api/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ token, password })
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Something went wrong');
        msg.className = 'msg ok';
        msg.textContent = j.message + ' Redirecting to login...';
        setTimeout(() => location.href = 'login.html', 2000);
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      }
    };
  </script>
</body>
</html>
