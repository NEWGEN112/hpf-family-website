<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HPF Leadership Dashboard</title>
<style>body{margin:0;background:#f3eee4;color:#171512;font-family:Arial}.wrap{max-width:1200px;margin:auto;padding:30px 5%}.nav{display:flex;justify-content:space-between}.nav a{color:#171512;text-decoration:none}.hero{margin:60px 0 25px;background:#151412;color:#fff;padding:35px}.ey{font-size:10px;letter-spacing:.2em;color:#d5a943;font-weight:800}h1,h2{font-family:Georgia,serif}h1{font-size:55px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel{background:#fffaf1;border:1px solid #d0c5b4;padding:25px}.stat b{font-size:35px}.panel{margin-top:18px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:11px;border-bottom:1px solid #ddd;text-align:left}input,textarea{width:100%;padding:12px;box-sizing:border-box;margin:6px 0 12px;border:1px solid #bbb}button{background:#d5a943;border:0;padding:13px 18px;font-weight:800}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}\n</style></head><body><div class="wrap"><div class="nav"><b>🔥 HPF FAMILY · LEADERSHIP</b><a href="dashboard.html">Member View →</a></div><section class="hero"><div class="ey">ADMINISTRATION</div><h1>Lead the family.</h1><p>Members, applications, prayer requests, testimonies, announcements and programs.</p></section><div class="stats"><div class="stat"><small>MEMBERS</small><br><b id="m">—</b></div><div class="stat"><small>APPLICATIONS</small><br><b id="a">—</b></div><div class="stat"><small>PRAYER</small><br><b id="p">—</b></div><div class="stat"><small>TESTIMONIES</small><br><b id="t">—</b></div></div>
<div class="panel"><h2>Recent Members</h2><div id="members">Loading...</div></div>
<div class="panel"><h2>Applications</h2><div id="apps">Loading...</div></div>
<div class="panel"><h2>Post Announcement</h2><input id="at" placeholder="Title"><textarea id="ab" placeholder="Announcement"></textarea><button onclick="postAnn()">POST ANNOUNCEMENT</button><span id="am"></span></div>
<div class="panel"><h2>Add Program</h2><input id="pt" placeholder="Program title"><input id="pd" placeholder="Date"><input id="ptime" placeholder="Time"><input id="pv" placeholder="Venue"><textarea id="px" placeholder="Description"></textarea><button onclick="postProg()">ADD PROGRAM</button><span id="pm"></span></div>
</div><script>
async function load(){try{const o=await(await fetch('/api/admin/overview')).json();if(o.error){location.href='login.html';return}m.textContent=o.members;a.textContent=o.applications;p.textContent=o.prayer_requests;t.textContent=o.testimonies;
const ms=await(await fetch('/api/admin/members')).json();members.innerHTML='<table><tr><th>Name</th><th>Phone</th><th>Campus</th><th>Hostel</th><th>Service</th></tr>'+ms.members.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.campus}</td><td>${x.hostel||'—'}</td><td>${x.service||'—'}</td></tr>`).join('')+'</table>';
const as=await(await fetch('/api/admin/applications')).json();apps.innerHTML='<table><tr><th>Type</th><th>Name</th><th>Phone</th><th>Campus</th><th>Status</th></tr>'+as.applications.map(x=>`<tr><td>${x.kind}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.campus}</td><td>${x.status}</td></tr>`).join('')+'</table>';
}catch(e){}}async function postAnn(){const r=await fetch('/api/admin/announcements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:at.value,body:ab.value})});am.textContent=r.ok?' Posted ✓':' Failed';load()}async function postProg(){const r=await fetch('/api/admin/programs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:pt.value,date:pd.value,time:ptime.value,venue:pv.value,description:px.value})});pm.textContent=r.ok?' Added ✓':' Failed';load()}load();
</script></body></html>
