<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HPF Member Login</title>
<style>body{margin:0;background:#f4f0e7;color:#171512;font-family:Arial}.wrap{max-width:700px;margin:auto;padding:40px 6%}.brand{color:#171512;text-decoration:none;font-weight:900}.box{margin-top:80px;background:#fffaf0;border:1px solid #d0c5b4;padding:35px}h1{font:52px Georgia,serif}.ey{font-size:10px;letter-spacing:.2em;color:#8c6b2d;font-weight:800}label{font-size:10px;font-weight:800;text-transform:uppercase}input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0 17px;border:1px solid #bbb;background:white}button{background:#d5a943;border:0;padding:15px 20px;font-weight:800}.msg{margin-top:15px;padding:14px;background:#f5dede}.ok{background:#e5efd9}.link{display:block;margin-top:22px;color:#8c6b2d}</style></head><body><div class="wrap"><a class="brand" href="index.html">🔥 HPF FAMILY</a>
<div class="box"><div class="ey">MEMBER LOGIN</div><h1>Welcome back.</h1><form id="login"><label>WhatsApp or email<input required name="identity"></label><label>Password<input required type="password" name="password"></label><button>Log In ↗</button></form><div id="msg"></div><a class="link" href="member.html">Create an HPF account →</a></div></div>
<script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();if(!r.ok)throw Error(j.error);m.className='msg ok';m.textContent='Login successful. Opening your HPF dashboard...';setTimeout(()=>location.href='dashboard.html',500)}catch(x){m.className='msg';m.textContent=x.message}};</script></body></html>
