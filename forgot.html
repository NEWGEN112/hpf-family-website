<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - HPF Family</title>
  <style>
    body { margin:0; background:#f4f0e7; font-family:Arial,sans-serif; color:#171512; }
    .wrap { max-width:500px; margin:auto; padding:40px 6%; }
    .brand { font-weight:900; text-decoration:none; color:#171512; }
    .box { margin-top:60px; background:#fffaf0; border:1px solid #d0c5b4; padding:30px; }
    h1 { font-family:Georgia,serif; font-size:36px; margin:10px 0 20px; }
    .ey { font-size:10px; letter-spacing:.2em; color:#8c6b2d; font-weight:800; }
    label { font-size:10px; font-weight:800; text-transform:uppercase; display:block; }
    input { width:100%; box-sizing:border-box; padding:14px; margin:8px 0 18px; border:1px solid #bbb; }
    button { background:#d5a943; border:0; padding:15px 22px; font-weight:800; width:100%; }
    .msg { margin-top:15px; padding:14px; display:none; }
    .ok { background:#e5efd9; display:block; }
    .err { background:#f5dede; display:block; }
    a { color:#8c6b2d; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="index.html">🔥 HPF FAMILY</a>
    <div class="box">
      <div class="ey">PASSWORD RECOVERY</div>
      <h1>Forgot your password?</h1>
      <p>Enter your WhatsApp number or email. We will send you a reset link.</p>
      <form id="forgot">
        <label>WhatsApp or Email</label>
        <input required name="identity" placeholder="070... or email@gmail.com">
        <button type="submit">Send Reset Link ↗</button>
      </form>
      <div id="msg" class="msg"></div>
      <p style="margin-top:20px"><a href="login.html">← Back to Login</a></p>
    </div>
  </div>
  <script>
    document.getElementById('forgot').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.style.display = 'block';
      msg.textContent = 'Sending...';
      try {
        const r = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Something went wrong');
        msg.className = 'msg ok';
        msg.textContent = j.message || 'Reset link sent! Check your email.';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      }
    };
  </script>
</body>
</html>
